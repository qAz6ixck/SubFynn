<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SubFynn</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", "Kanit", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .splash-card {
      width: 360px;
      height: 300px;
      background: rgba(35, 33, 44, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.65), 0 0 32px rgba(139, 92, 246, 0.12);
      overflow: hidden;
    }

    /* Ambient background gradient glow */
    .glow-ambient {
      position: absolute;
      top: 15%;
      left: 50%;
      transform: translateX(-50%);
      width: 160px;
      height: 160px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.28) 0%, rgba(236, 72, 153, 0.12) 50%, transparent 70%);
      filter: blur(24px);
      pointer-events: none;
      z-index: 1;
      animation: pulse-glow 3s ease-in-out infinite alternate;
    }

    @keyframes pulse-glow {
      0% { opacity: 0.6; transform: translateX(-50%) scale(0.9); }
      100% { opacity: 1.0; transform: translateX(-50%) scale(1.15); }
    }

    .logo-container {
      position: relative;
      width: 102px;
      height: 102px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      margin-bottom: 14px;
    }

    .logo-img {
      width: 102px;
      height: 102px;
      object-fit: contain;
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.45));
    }

    .brand-title {
      z-index: 2;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #F8FAFC;
      margin-bottom: 2px;
    }

    .brand-subtitle {
      z-index: 2;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #94A3B8;
      margin-bottom: 18px;
    }

    /* Sleek loading bar */
    .progress-track {
      z-index: 2;
      width: 180px;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
      margin-bottom: 10px;
    }

    .progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 45%;
      background: linear-gradient(90deg, #8B5CF6, #EC4899);
      border-radius: 9999px;
      animation: progress-slide 1.8s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }

    @keyframes progress-slide {
      0% { left: -45%; width: 35%; }
      50% { width: 55%; }
      100% { left: 100%; width: 35%; }
    }

    .status-text {
      z-index: 2;
      font-size: 11px;
      font-weight: 500;
      color: #64748B;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <div class="splash-card">
    <div class="glow-ambient"></div>
    <div class="logo-container">
      <img src="assets/app_icon.png" alt="SubFynn Logo" class="logo-img" />
    </div>
    <div class="brand-title">SubFynn</div>
    <div class="brand-subtitle">AI Subtitle Studio</div>
    <div class="progress-track">
      <div class="progress-bar"></div>
    </div>
    <div class="status-text" id="status-label">Initializing engine...</div>
  </div>
</body>
</html>
